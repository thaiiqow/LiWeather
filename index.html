<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LiWeather</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      padding: 50px 20px 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    .search-box {
      width: 100%;
      max-width: 400px;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      font-size: 16px;
      outline: none;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    button {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 14px;
      padding: 12px 20px;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
    }

    /* Glassmorphism Card */
    .glass-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    .city {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .temp {
      font-size: 64px;
      font-weight: 800;
      margin: 10px 0;
    }

    .status {
      font-size: 16px;
      opacity: 0.85;
    }

    /* Forecast List */
    .forecast-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      flex: 1;
      overflow-y: auto;
    }

    .forecast-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      opacity: 0.9;
    }

    .forecast-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 14px;
    }

    .forecast-date { font-weight: 600; }
    .forecast-temp { font-weight: 700; }
  </style>
</head>
<body>

  <h1>LiWeather</h1>

  <div class="search-box">
    <input type="text" id="cityInput" placeholder="Введите город...">
    <button onclick="searchWeather()">Найти</button>
  </div>

  <div class="glass-card">
    <div class="city" id="cityName">Загрузка...</div>
    <div class="temp" id="currentTemp">--°C</div>
    <div class="status" id="weatherStatus">Запрос данных...</div>
  </div>

  <div class="forecast-card">
    <div class="forecast-title">Прогноз на 16 дней</div>
    <div id="forecastList"></div>
  </div>

  <script>
    async function getWeather(city) {
      try {
        // Геокодинг
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ru&format=json`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          document.getElementById('weatherStatus').innerText = 'Город не найден';
          return;
        }

        const loc = geoData.results[0];
        const fullCity = loc.country ? `${loc.name}, ${loc.country}` : loc.name;

        // Погода
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&forecast_days=16&timezone=auto`);
        const data = await weatherRes.json();

        const current = data.current_weather;
        const temp = Math.round(current.temperature);
        
        document.getElementById('cityName').innerText = fullCity;
        document.getElementById('currentTemp').innerText = `${temp > 0 ? '+' : ''}${temp}°C`;
        document.getElementById('weatherStatus').innerText = 'Обновлено';

        // Рендер 16 дней
        const daily = data.daily;
        const listContainer = document.getElementById('forecastList');
        listContainer.innerHTML = '';

        const daysMap = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        daily.time.forEach((timeStr, i) => {
          const date = new Date(timeStr);
          const dayName = i === 0 ? 'Сегодня' : `${daysMap[date.getDay()]}, ${date.getDate()}.${date.getMonth() + 1}`;
          const maxT = Math.round(daily.temperature_2m_max[i]);
          const minT = Math.round(daily.temperature_2m_min[i]);

          const item = document.createElement('div');
          item.className = 'forecast-item';
          item.innerHTML = `
            <span class="forecast-date">${dayName}</span>
            <span class="forecast-temp">${maxT > 0 ? '+' : ''}${maxT}° / ${minT > 0 ? '+' : ''}${minT}°</span>
          `;
          listContainer.appendChild(item);
        });

      } catch (err) {
        document.getElementById('weatherStatus').innerText = 'Ошибка сети';
      }
    }

    function searchWeather() {
      const city = document.getElementById('cityInput').value.trim();
      if (city) getWeather(city);
    }

    // Запуск при старте
    getWeather('Южно-Сахалинск');
  </script>
</body>
</html>
